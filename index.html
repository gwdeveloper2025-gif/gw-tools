<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW Tools Hub | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main-content">
    <nav class="nav-bar">
        <div class="nav-links">
            <button class="nav-btn active" id="btn-common" onclick="filterTools('common')">COMMON</button>
            <button class="nav-btn" id="btn-admin" onclick="filterTools('admin')">ADMIN/SALES</button>
            <button class="nav-btn" id="btn-bd" onclick="filterTools('bd')">BD & SALES</button>
            <button class="nav-btn" id="btn-project" onclick="filterTools('project')">PROJECT</button>
            <button class="nav-btn" id="btn-marketing" onclick="filterTools('marketing')">MARKETING</button>
        </div>

        <div class="search-container">
            <input type="text" id="tool-search" placeholder="ค้นหาเครื่องมือ..." onkeyup="handleSearch()">
            <span class="search-icon">🔍</span>
        </div>
        
        <div class="nav-controls">
            <button class="nav-btn" id="tool-mgmt-btn" onclick="openToolMgmtModal()" style="border-color: #10b981;">🛠️ MANAGE TOOLS</button>
            <div class="theme-dropdown" id="theme-dropdown">
                <button class="theme-dropbtn" onclick="toggleThemeDropdown()">
                    <span id="current-theme-icon">💻</span>
                    <span id="current-theme-text">Auto</span>
                </button>
                <div class="theme-dropdown-content">
                    <button id="theme-light" onclick="setTheme('light')">☀️ Light</button>
                    <button id="theme-dark" onclick="setTheme('dark')">🌙 Dark</button>
                    <button id="theme-auto" class="active" onclick="setTheme('auto')">💻 Auto</button>
                </div>
            </div>
        </div>
    </nav>

<!-- Tool Management Modal -->
<div id="tool-mgmt-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(5px);">
    <div class="login-box">
        <div style="font-size: 2.5rem; margin-bottom: 15px;">🛠️</div>
        <h3>จัดการเครื่องมือระบบ</h3>
        
        <div id="tool-list-mgmt">
            <!-- Tools will be listed here -->
        </div>

        <div class="tool-form-container">
            <h4 id="tool-form-title" style="margin-bottom: 25px; font-size: 1.3rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px;">
                <span style="width: 8px; height: 25px; background: var(--premium-gradient); border-radius: 4px;"></span>
                เพิ่มเครื่องมือใหม่
            </h4>
            <input type="hidden" id="edit-tool-id">
            
            <div class="form-row">
                <div class="form-group">
                    <label>ชื่อเครื่องมือ (Title)</label>
                    <input type="text" id="tool-name" placeholder="เช่น ChatGPT, Jira...">
                </div>
                <div class="form-group">
                    <label>ลิงก์ URL (Link)</label>
                    <input type="text" id="tool-url" placeholder="https://...">
                </div>
            </div>

            <div class="form-group">
                <label>คำอธิบายสั้นๆ (Description)</label>
                <input type="text" id="tool-desc" placeholder="ผู้ช่วยเขียนบทความด้วย AI...">
            </div>
            
            <div class="form-group">
                <label>ไอคอนเครื่องมือ (Icon)</label>
                <div class="upload-wrapper">
                    <div id="image-preview-container" class="preview-box">
                        <img id="image-preview" src="" style="display: none;">
                        <span id="preview-placeholder">🖼️</span>
                    </div>
                    <div class="upload-controls">
                        <label for="tool-image-file" class="custom-file-upload">
                            <span>📂 เลือกไฟล์ภาพ</span>
                            <input type="file" id="tool-image-file" accept="image/*">
                        </label>
                        <p class="file-hint">แนะนำไฟล์ PNG/SVG (ขนาด 1:1)</p>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>แผนกที่ระบุ (Department)</label>
                    <input type="text" id="tool-dept-text" placeholder="แผนก BD, Marketing">
                </div>
                <div class="form-group">
                    <label>ข้อความบนปุ่ม (Button)</label>
                    <input type="text" id="tool-btn-text" placeholder="เข้าสู่ระบบ">
                </div>
            </div>

            <div class="form-group">
                <label>หมวดหมู่หลัก (Category)</label>
                <select id="tool-category" class="custom-select">
                    <option value="common">Common Tools</option>
                    <option value="admin">Admin/พนักงานขาย</option>
                    <option value="bd">BD & Sales</option>
                    <option value="project">Project Management</option>
                    <option value="marketing">Marketing</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button id="btn-save-tool" class="primary-btn" style="flex: 2;" onclick="saveTool()">บันทึกข้อมูล</button>
                <button id="btn-cancel-edit" class="secondary-btn hidden" style="flex: 1;" onclick="resetToolForm()">ยกเลิก</button>
            </div>
        </div>
        
        <button class="close-modal-btn" onclick="closeToolMgmtModal()">ปิดหน้าต่างจัดการ</button>
    </div>
</div>

<div class="container">
    <div id="greeting-wrapper" class="greeting-card">
        <div class="greeting-content">
            <h1 id="greeting-text">ยินดีต้อนรับสู่ GW Tools Hub!</h1>
            <p id="greeting-subtext">ศูนย์รวมเครื่องมือสำหรับการทำงานทีม GoodWork</p>
        </div>
        <div class="greeting-time" id="live-clock">00:00:00</div>
    </div>

    <!-- Common Tools -->
    <div class="category-section" id="section-common">
        <div class="section-title">Common Tools</div>
        <div class="tool-grid" id="grid-common"></div>
    </div>

    <!-- Admin/Sales Tools -->
    <div class="category-section" id="section-admin">
        <div class="section-title">Admin / พนักงานขาย</div>
        <div class="tool-grid" id="grid-admin"></div>
    </div>

    <!-- Business Development & Sales -->
    <div class="category-section" id="section-bd">
        <div class="section-title">Business Development & Sales</div>
        <div class="tool-grid" id="grid-bd"></div>
    </div>

    <!-- Project Management -->
    <div class="category-section" id="section-project">
        <div class="section-title">Project Management</div>
        <div class="tool-grid" id="grid-project"></div>
    </div>

    <!-- Marketing -->
    <div class="category-section" id="section-marketing">
        <div class="section-title">Marketing</div>
        <div class="tool-grid" id="grid-marketing"></div>
    </div>
</div> <!-- End of container -->

</div> <!-- End of main-content -->

<script src="script.js"></script>
</body>
</html>
